
name: Build and Sign AulaViva

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build-and-sign.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar Cosign
        uses: sigstore/cosign-installer@v4.1.3

      - name: Construir y publicar imagen
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/rai54/aulaviva-staging:latest

      - name: Firmar imagen con Cosign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "ghcr.io/rai54/aulaviva-staging@${DIGEST}"

      - name: Verificar firma Cosign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity "https://github.com/Rai54/AulaVivaExpo/.github/workflows/build-and-sign.yaml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "ghcr.io/rai54/aulaviva-staging@${DIGEST}"

